[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metalsq"
version = "0.1.0"
description = "Few-shot meta-learning with a closed-form Sobolev least-squares inner solver"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Antonin Sulc"}]
requires-python = ">=3.9"   # tested in CI on 3.10 and 3.12; developed on 3.9
dependencies = ["torch>=2.0", "numpy"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["metalsq"]
